[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cockpit"
authors = [
    { name = "Elias Magalhães", email = "elias@brasidata.com" }
]
version = "0.1.0"
description = "Cockpit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ontobdc>=0.21.0",
    "ontobdc-view>=0.8.0",
]

[project.scripts]
cockpit = "cockpit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cockpit*"]

[tool.setuptools.package-data]
cockpit = [
    "**/*.yaml",
    "**/*.ttl",
]
