name: Temporary AECO ontology consolidation

on:
  push:
    branches:
      - chatgpt/fix-aeco-sanitary-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-aeco-sanitary-layout
          fetch-depth: 0

      - name: Consolidate sanitary concepts into AECO ns.ttl
        shell: python
        run: |
          from pathlib import Path

          ns = Path('ontology/domain/aeco/ns.ttl')
          sanitary = Path('ontology/domain/aeco/sanitary.ttl')
          text = ns.read_text(encoding='utf-8')
          marker = '###  Hydraulic project sanitary concepts'

          block = r'''

###  Hydraulic project sanitary concepts

###  http://datacenter.app.br/ontology/domain/aeco/ns.ttl#Chuveiro
:Chuveiro rdf:type owl:Class ;
          owl:equivalentClass :Shower ;
          dcterms:identifier "Chuveiro" ;
          skos:prefLabel "Chuveiro"@pt-br ,
                         "Shower"@en .


###  http://datacenter.app.br/ontology/domain/aeco/ns.ttl#Shower
:Shower rdf:type owl:Class ;
        owl:equivalentClass :Chuveiro ;
        dcterms:identifier "Shower" ;
        skos:prefLabel "Shower"@en .


###  http://datacenter.app.br/ontology/domain/aeco/ns.ttl#PiaDeCozinha
:PiaDeCozinha rdf:type owl:Class ;
              rdfs:subClassOf :Pia ;
              owl:equivalentClass :KitchenSink ;
              dcterms:identifier "PiaDeCozinha" ;
              skos:prefLabel "Pia de cozinha"@pt-br ,
                             "Kitchen sink"@en .


###  http://datacenter.app.br/ontology/domain/aeco/ns.ttl#KitchenSink
:KitchenSink rdf:type owl:Class ;
             rdfs:subClassOf :Sink ;
             owl:equivalentClass :PiaDeCozinha ;
             dcterms:identifier "KitchenSink" ;
             skos:prefLabel "Kitchen sink"@en .


###  http://datacenter.app.br/ontology/domain/aeco/ns.ttl#RaloSeco
:RaloSeco rdf:type owl:Class ;
          rdfs:subClassOf :Ralo ;
          owl:equivalentClass :FloorWaste ;
          dcterms:identifier "RaloSeco" ;
          skos:prefLabel "Ralo seco"@pt-br ,
                         "Floor waste"@en .


###  http://datacenter.app.br/ontology/domain/aeco/ns.ttl#FloorWaste
:FloorWaste rdf:type owl:Class ;
            rdfs:subClassOf :Drain ;
            owl:equivalentClass :RaloSeco ;
            dcterms:identifier "FloorWaste" ;
            skos:prefLabel "Floor waste"@en .


###  http://datacenter.app.br/ontology/domain/aeco/ns.ttl#RaloSifonado
:RaloSifonado rdf:type owl:Class ;
              rdfs:subClassOf :Ralo ;
              owl:equivalentClass :FloorTrap ;
              dcterms:identifier "RaloSifonado" ;
              skos:prefLabel "Ralo sifonado"@pt-br ,
                             "Floor trap"@en .


###  http://datacenter.app.br/ontology/domain/aeco/ns.ttl#FloorTrap
:FloorTrap rdf:type owl:Class ;
           rdfs:subClassOf :Drain ;
           owl:equivalentClass :RaloSifonado ;
           dcterms:identifier "FloorTrap" ;
           skos:prefLabel "Floor trap"@en .


###  Inspection box / junction box equivalence for the hydraulic project
:CaixaDeInspecao owl:equivalentClass :CaixaDePassagem .
'''

          if marker not in text:
              generated = '###  Generated by the OWL API'
              if generated in text:
                  text = text.replace(generated, block + '\n\n' + generated, 1)
              else:
                  text = text.rstrip() + block + '\n'
              ns.write_text(text, encoding='utf-8')

          if sanitary.exists():
              sanitary.unlink()

      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ontology/domain/aeco/ns.ttl ontology/domain/aeco/sanitary.ttl
          git diff --cached --exit-code && exit 0
          git commit -m "fix(ontology): consolidate sanitary concepts in AECO namespace"
          git push origin HEAD:chatgpt/fix-aeco-sanitary-layout
