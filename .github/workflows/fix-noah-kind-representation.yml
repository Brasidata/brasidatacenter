name: Repair noah kind representation dimensions

on:
  push:
    branches:
      - chatgpt/kind-representation-dimensions

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out noah-release
        uses: actions/checkout@v4
        with:
          ref: noah-release
          fetch-depth: 0

      - name: Restore clean pre-merge representation file
        shell: bash
        run: |
          git show b9eb5e407b08a4fdcd7a31ae28f18c61512a0513:ontology/domain/aeco/kind_representation.ttl > ontology/domain/aeco/kind_representation.ttl

      - name: Apply dimensions to the correct Visual classes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ontology/domain/aeco/kind_representation.ttl")
          text = path.read_text(encoding="utf-8")

          xsd_prefix = "@prefix xsd: <http://www.w3.org/2001/XMLSchema#> ."
          if xsd_prefix not in text:
              anchor = "@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> ."
              if anchor not in text:
                  raise RuntimeError("rdfs prefix anchor not found")
              text = text.replace(anchor, anchor + "\n" + xsd_prefix, 1)

          dimensions = {
              "FloorTrapVisual": ("0.15", "0.15", "0.10"),
              "FloorWasteVisual": ("0.10", "0.10", "0.05"),
              "ConcreteBeamVisual": ("3.00", "0.20", "0.40"),
              "BedVisual": ("1.90", "1.40", "0.50"),
              "OfficeChairVisual": ("0.60", "0.60", "1.00"),
              "WindowVisual": ("1.20", "0.05", "1.20"),
              "OfficeDeskVisual": ("1.20", "0.60", "0.75"),
              "DoorVisual": ("0.80", "0.05", "2.10"),
              "ConcretePadFootingVisual": ("1.00", "1.00", "0.50"),
              "RoofVisual": ("10.00", "10.00", "0.20"),
              "FootingVisual": ("1.00", "1.00", "0.50"),
          }

          geometry_tail = (
              "            owl:onProperty omg:hasGeometry ;\n"
              "            owl:someValuesFrom aeco:SolidBox3DRepresentation\n"
              "        ] ."
          )

          for class_name, (x_value, y_value, z_value) in dimensions.items():
              marker = f":{class_name} rdf:type owl:Class ;"
              start = text.find(marker)
              if start < 0:
                  raise RuntimeError(f"class not found: {class_name}")
              next_class = text.find("\n:", start + len(marker))
              end = len(text) if next_class < 0 else next_class + 1
              block = text[start:end]
              if "aeco:xLength" in block or "aeco:yLength" in block or "aeco:zLength" in block:
                  raise RuntimeError(f"dimensions already present in {class_name}")
              if geometry_tail not in block:
                  raise RuntimeError(f"solid-box geometry tail not found in {class_name}")

              replacement = (
                  "            owl:onProperty omg:hasGeometry ;\n"
                  "            owl:someValuesFrom aeco:SolidBox3DRepresentation\n"
                  "        ] ,\n"
                  "        [\n"
                  "            rdf:type owl:Restriction ;\n"
                  "            owl:onProperty aeco:xLength ;\n"
                  f"            owl:hasValue \"{x_value}\"^^xsd:double\n"
                  "        ] ,\n"
                  "        [\n"
                  "            rdf:type owl:Restriction ;\n"
                  "            owl:onProperty aeco:yLength ;\n"
                  f"            owl:hasValue \"{y_value}\"^^xsd:double\n"
                  "        ] ,\n"
                  "        [\n"
                  "            rdf:type owl:Restriction ;\n"
                  "            owl:onProperty aeco:zLength ;\n"
                  f"            owl:hasValue \"{z_value}\"^^xsd:double\n"
                  "        ] ."
              )
              block = block.replace(geometry_tail, replacement, 1)
              text = text[:start] + block + text[end:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate Turtle and dimension placement
        shell: bash
        run: |
          python -m pip install --quiet rdflib
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph, Namespace, RDF, RDFS, OWL

          aeco = Namespace("http://datacenter.app.br/ontology/domain/aeco/ns.ttl#")
          rep = Namespace("http://datacenter.app.br/ontology/domain/aeco/kind_representation.ttl#")

          graph = Graph()
          graph.parse("ontology/domain/aeco/ns.ttl", format="turtle")
          graph.parse("ontology/domain/aeco/kind_representation.ttl", format="turtle")

          expected = {
              "FloorTrapVisual",
              "FloorWasteVisual",
              "ConcreteBeamVisual",
              "BedVisual",
              "OfficeChairVisual",
              "WindowVisual",
              "OfficeDeskVisual",
              "DoorVisual",
              "ConcretePadFootingVisual",
              "RoofVisual",
              "FootingVisual",
          }

          dimension_properties = {aeco.xLength, aeco.yLength, aeco.zLength}
          for name in expected:
              subject = rep[name]
              found = set()
              for restriction in graph.objects(subject, RDFS.subClassOf):
                  if (restriction, RDF.type, OWL.Restriction) not in graph:
                      continue
                  prop = graph.value(restriction, OWL.onProperty)
                  if prop in dimension_properties:
                      value = graph.value(restriction, OWL.hasValue)
                      if value is None:
                          raise RuntimeError(f"{name}: dimension without hasValue")
                      found.add(prop)
              if found != dimension_properties:
                  raise RuntimeError(f"{name}: expected 3 dimensions, found {len(found)}")

          for subject in set(graph.subjects(RDFS.subClassOf, aeco.IfcElementBinding)):
              if not str(subject).endswith("IfcBinding"):
                  continue
              for restriction in graph.objects(subject, RDFS.subClassOf):
                  prop = graph.value(restriction, OWL.onProperty)
                  if prop in dimension_properties:
                      raise RuntimeError(f"dimension incorrectly attached to IFC binding: {subject}")

          print("Turtle valid; 11 Visual classes carry xLength/yLength/zLength; no IfcBinding carries dimensions.")
          PY

      - name: Commit repaired ontology to noah-release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ontology/domain/aeco/kind_representation.ttl
          git diff --cached --check
          git commit -m "fix(ontology): repair visual representation dimensions"
          git push origin HEAD:noah-release
