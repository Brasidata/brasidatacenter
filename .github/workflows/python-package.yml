name: Python package

on:
  push:
    branches:
      - feat/presentation-tile-lab
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test resource access
        run: pytest

      - name: Build distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Verify ontologies are present in wheel
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()

          expected = "brasidatacenter/ontology/social/entity/ns.ttl"
          if expected not in names:
              raise SystemExit(f"missing packaged ontology: {expected}")

          ontology_files = [name for name in names if name.startswith("brasidatacenter/ontology/")]
          print(f"wheel contains {len(ontology_files)} ontology resources")
